name: Model Refresh Guardrails

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 7 * * MON'
    - cron: '0 7 * * THU'
  workflow_dispatch:

jobs:
  refresh-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full refresh pipelines + strict gates
        run: |
          bash scripts/full_refresh_with_gates.sh

      - name: Upload readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refresh-guardrails
          path: |
            reports/champion_runs/refresh_readiness.json
            reports/champion_runs/data_freshness_audit.json
