name: Nightly QoL Reports

on:
  schedule:
    - cron: '15 11 * * *' # 05:15 CST / 06:15 CDT approximate
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate nightly reports
        env:
          AUTOMATION_DB_PATH: ${{ secrets.AUTOMATION_DB_PATH }}
          DELIVER_REPORTS: '1'
          REPORTS_DISCORD_WEBHOOK_URL: ${{ secrets.REPORTS_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORTS_S3_BUCKET: ${{ secrets.REPORTS_S3_BUCKET }}
          REPORTS_S3_PREFIX: ${{ secrets.REPORTS_S3_PREFIX }}
        run: |
          bash scripts/run_nightly_reports.sh

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qol-reports
          path: |
            reports/clv_report.md
            reports/experiment_report.md
            reports/nightly_snapshot.md
